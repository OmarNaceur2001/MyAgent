name: CI

on:
  push:
    branches: [main, design/omar-character-refresh]
  pull_request:
    branches: [main]

jobs:
  agent-tests:
    name: Python agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r agent/requirements.txt numpy
      - name: Run tests
        run: python -m pytest -q agent/tests
        env:
          PYTHONPATH: agent

  app-build:
    name: Electron and React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Type-check
        working-directory: app
        run: npm run typecheck
      - name: Build
        working-directory: app
        run: npm run build
